<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed in browser tab -->
    <title>Nested List Example</title>
</head>

<body>

    <!-- Main unordered list -->
    <ul>

        <!-- First main list item -->
        <li>
            Fruits

            <!-- Nested unordered list for fruits -->
            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Mango</li>
                <li>Orange</li>
            </ul>
        </li>

        <!-- Second main list item -->
        <li>
            Vegetables

            <!-- Nested unordered list for vegetables -->
            <ul>
                <li>Spinach</li>
                <li>Cauliflower</li>
                <li>Beetroot</li>
            </ul>
        </li>

        <!-- Other main list items -->
        <li>Cereals</li>
        <li>Nuts</li>

    </ul>

</body>

</html>
